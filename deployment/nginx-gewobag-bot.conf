# Nginx-Konfiguration für Gewobag Bot Web-Frontend
# Datei: /etc/nginx/sites-available/gewobag-bot

server {
    listen 80;
    server_name YOUR_DOMAIN.COM;  # Hier deine Domain oder VPS-IP eintragen

    # Max Upload-Größe für Dokumente (PDFs, etc.)
    client_max_body_size 20M;

    # Root-Location für Web-Frontend
    location / {
        # Proxy zu Docker-Container (Port 5000)
        proxy_pass http://localhost:5000;

        # HTTP-Version
        proxy_http_version 1.1;

        # WebSocket-Support (falls benötigt)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Header für Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache-Bypass
        proxy_cache_bypass $http_upgrade;

        # Timeouts (wichtig für lange Requests wie Bot-Ausführung)
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # Static Files (falls vorhanden)
    location /static/ {
        alias /home/botuser/gewobag-bot/frontend/;
        expires 30d;
        access_log off;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logs
    access_log /var/log/nginx/gewobag-bot-access.log;
    error_log /var/log/nginx/gewobag-bot-error.log;

    # Gzip-Kompression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;
}


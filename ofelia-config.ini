# Ofelia Scheduler Configuration
# Dokumentation: https://github.com/mcuadros/ofelia

[job-run "gewobag-bot-job"]
# Zeitplan: Alle 15 Minuten
schedule = @every 15m

# Docker Image
image = gewobot-gewobag-bot:latest

# Netzwerk (wird automatisch von docker-compose erstellt)
network = gewobot_default

# Container nach Ausführung löschen
delete = true

# Keine überlappenden Jobs
no-overlap = true

# Volumes (absolute Pfade auf VPS!)
# WICHTIG: Passen Sie /root/gewoBot an Ihren tatsächlichen Pfad an!
volume = /root/gewoBot/user_data.json:/app/user_data.json:ro
volume = /root/gewoBot/filter_config.json:/app/filter_config.json:ro
volume = /root/gewoBot/gewobag_wohnungen.db:/app/gewobag_wohnungen.db
volume = /root/gewoBot/logs:/app/logs
volume = /root/gewoBot/.bot_heartbeat.json:/app/.bot_heartbeat.json
volume = /root/gewoBot/documents:/app/documents:ro

# Umgebungsvariablen
environment = ["TZ=Europe/Berlin", "PYTHONUNBUFFERED=1"]

# Befehl zum Ausführen
command = python main.py --full

# ============================================
# Alternative Zeitpläne (auskommentiert)
# ============================================

# Alle 30 Minuten:
# schedule = @every 30m

# Stündlich:
# schedule = @hourly

# Alle 6 Stunden:
# schedule = @every 6h

# Täglich um 9:00 Uhr:
# schedule = 0 9 * * *

# Mo-Fr, 9-18 Uhr, alle 15 Min:
# schedule = */15 9-18 * * 1-5

# Nur Werktags um 8:00, 12:00, 18:00 Uhr:
# schedule = 0 8,12,18 * * 1-5

services:
  # ===== Bot-Service (CLI-Modus) =====
  # Hinweis: Dieser Service wird vom Scheduler gestartet (job-run)
  # Er muss nur gebaut werden, läuft aber nicht dauerhaft
  gewobag-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: gewobot-gewobag-bot:latest
    container_name: gewobag-bot-manual

    # Nur für manuelle Ausführung (nicht für Scheduler)
    profiles:
      - manual

    # Umgebungsvariablen
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1

    # Volumes für persistente Daten
    volumes:
      # Konfigurationsdateien (read-only)
      - ./user_data.json:/app/user_data.json:ro
      - ./filter_config.json:/app/filter_config.json:ro

      # Datenbank und Logs (read-write)
      - ./gewobag_wohnungen.db:/app/gewobag_wohnungen.db
      - ./logs:/app/logs

      # Heartbeat-Datei (für Status-Tracking)
      - ./.bot_heartbeat.json:/app/.bot_heartbeat.json

      # Optionale Dokumente (read-only)
      - ./documents:/app/documents:ro

    # Netzwerk (optional, falls Proxy benötigt wird)
    # network_mode: host

    # Ressourcen-Limits (optional, für Production empfohlen)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Logging-Konfiguration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Standard-Kommando für manuelle Ausführung
    # Optionen: --scrape, --apply, --full, --setup
    command: ["python", "main.py", "--full"]

  # ===== Web-Frontend Service (NEU in v2.2) =====
  gewobag-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gewobag-web
    restart: unless-stopped

    # Umgebungsvariablen
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production

    # Port für Web-Interface
    ports:
      - "5000:5000"

    # Volumes (gleiche wie Bot-Service)
    volumes:
      # Konfigurationsdateien (read-write für Web-Interface)
      - ./user_data.json:/app/user_data.json
      - ./filter_config.json:/app/filter_config.json

      # Datenbank und Logs (read-write)
      - ./gewobag_wohnungen.db:/app/gewobag_wohnungen.db
      - ./logs:/app/logs

      # Heartbeat-Datei (für Status-Tracking)
      - ./.bot_heartbeat.json:/app/.bot_heartbeat.json

      # Optionale Dokumente (read-only)
      - ./documents:/app/documents:ro

    # Ressourcen-Limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    # Logging-Konfiguration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Web-API starten
    command: ["python", "web_api.py"]

    # Healthcheck für Web-API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===== Scheduler Service mit Ofelia (empfohlen für Production) =====
  # Führt den Bot automatisch alle 15 Minuten aus
  # Aktivieren: docker-compose up -d gewobag-scheduler
  gewobag-scheduler:
    image: mcuadros/ofelia:latest
    container_name: gewobag-scheduler
    restart: unless-stopped

    # Scheduler-Daemon starten
    command: daemon --docker

    # Docker-Socket für Container-Steuerung
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # Job-Konfiguration via Labels
    labels:
      # Job-Name: gewobag-bot-job
      # WICHTIG: job-run startet NEUE Container (nicht job-exec!)
      ofelia.job-run.gewobag-bot-job.schedule: "@every 15m"
      ofelia.job-run.gewobag-bot-job.image: "gewobot-gewobag-bot:latest"
      ofelia.job-run.gewobag-bot-job.network: "gewobot_default"
      ofelia.job-run.gewobag-bot-job.delete: "true"
      ofelia.job-run.gewobag-bot-job.no-overlap: "true"
      ofelia.job-run.gewobag-bot-job.volume: "./user_data.json:/app/user_data.json:ro,./filter_config.json:/app/filter_config.json:ro,./gewobag_wohnungen.db:/app/gewobag_wohnungen.db,./logs:/app/logs,./.bot_heartbeat.json:/app/.bot_heartbeat.json,./documents:/app/documents:ro"
      ofelia.job-run.gewobag-bot-job.environment: "TZ=Europe/Berlin,PYTHONUNBUFFERED=1"
      ofelia.job-run.gewobag-bot-job.command: "python main.py --full"

      # Alternative Zeitpläne (auskommentiert):
      # Alle 30 Minuten:
      # ofelia.job-run.gewobag-bot-job.schedule: "@every 30m"

      # Stündlich:
      # ofelia.job-run.gewobag-bot-job.schedule: "@hourly"

      # Alle 6 Stunden:
      # ofelia.job-run.gewobag-bot-job.schedule: "@every 6h"

      # Cron-Syntax (Mo-Fr, 9-18 Uhr, alle 15 Min):
      # ofelia.job-run.gewobag-bot-job.schedule: "*/15 9-18 * * 1-5"

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
